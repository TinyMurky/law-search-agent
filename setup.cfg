[pycodestyle]
max-line-length = 79
# E121,E123,E126,E133,E226,W503,W504,W505: pycodestyle 預設 ignore list，
#   使用 ignore 選項時預設值會被覆蓋，需手動帶入。
# E203: Black 格式化 slice 時在冒號兩側加空格（docs[i : i + n]），
#   符合 PEP 8 但 pycodestyle 誤判為錯誤。
# E241: Black 對齊 dict literal 時會在冒號後加多個空格，
#   pycodestyle 誤判為錯誤。
ignore = E121,E123,E126,E133,E226,W503,W504,W505,E203,E241
