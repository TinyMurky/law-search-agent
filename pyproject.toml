[project]
name = "law-search-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.4.0",
    "langchain-google-genai>=4.2.3",
    "langgraph>=1.2.2",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "mccabe>=0.7.0",
    "mypy>=2.1.0",
    "pycodestyle>=2.14.0",
    "pyflakes>=3.4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-lsp-server>=1.14.0",
    "types-networkx>=3.6.1.20260518",
    "types-tqdm>=4.67.3.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
