[project]
name = "law-search-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "mccabe>=0.7.0",
    "mypy>=2.1.0",
    "pycodestyle>=2.14.0",
    "pyflakes>=3.4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-lsp-server>=1.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
